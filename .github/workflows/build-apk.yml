name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布版本号 Tag (例如 v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build APK with Gradle
        working-directory: android
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk "../dist-apk/ComfyUI-PromptStudio-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "../dist-apk/ComfyUI-PromptStudio-latest.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI-PromptStudio-Android-APK
          path: dist-apk/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "ComfyUI AI Prompt Studio ${{ steps.release_info.outputs.tag }}"
          draft: false
          prerelease: false
          files: |
            dist-apk/ComfyUI-PromptStudio-${{ steps.release_info.outputs.tag }}.apk
            dist-apk/ComfyUI-PromptStudio-latest.apk
          body: |
            ### 📱 MOSS Prompt & Image Studio 移动端 Android 安装包 (${{ steps.release_info.outputs.tag }})

            欢迎下载使用 **MOSS AI Prompt Studio** 移动端 App！

            #### ✨ 本次更新重点 (v1.0.2)
            - 🌟 **MOSS 官方生图 API 直连**：直连 MOSS (MOSI) 官方出图接口 (`https://api.mosi.cn/v1/images/generations`)，支持输入 `moss_api_key` 直接在手机端出图，无需依赖本地电脑或 ComfyUI！
            - 🎯 **MOSS-Image 全模型与分辨率矩阵**：完整支持 `moss-image-sft-1.0` (推荐)、`moss-image-base-1.0` 以及 1:1、2:3、3:2、9:16、16:9、1:2 (1024x2048) 等全套官方推荐宽高比白名单。
            - 🛡️ **CDN 防盗链直链优化**：彻底解决 MOSI 官方 CDN Referer ACL 阻断导致的图片裂图问题，支持一键无损保存原图到手机系统相册！
            - ✍️ **MOSS 散文提示词工坊**：针对 Qwen3.5 文本编码器与 DiT 特性量身定制，涵盖写实摄影、二次元日漫、跨次元 2D-in-3D 等核心画风与构图光影词库，支持离线快速直拼与 AI 散文扩写。
            - 📷 **多模态识图反推**：手机拍照或相册选图后，一键反推高拟合度 MOSS 散文描述词或 Danbooru 动漫标签，并可一键转入出图。

            #### 📥 下载安装方法
            1. 点击下方 Assets 区域的 **`ComfyUI-PromptStudio-${{ steps.release_info.outputs.tag }}.apk`** 或 **`ComfyUI-PromptStudio-latest.apk`** 下载。
            2. 在 Android 手机上打开安装（首次安装需允许系统安装来自浏览器的应用）。
            3. 安装完成即可直接使用！
