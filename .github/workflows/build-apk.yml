name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布版本号 Tag (例如 v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/ComfyUI-PromptStudio-v1.0.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI-PromptStudio-Android-APK
          path: dist-apk/ComfyUI-PromptStudio-v1.0.0.apk

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "ComfyUI AI Prompt Studio ${{ steps.release_info.outputs.tag }}"
          draft: false
          prerelease: false
          files: dist-apk/ComfyUI-PromptStudio-v1.0.0.apk
          body: |
            ### 📱 ComfyUI AI Prompt Studio Android 安装包发布

            欢迎下载使用 **ComfyUI AI Prompt Studio** 移动端 App！

            #### ✨ 主要特性
            - 🖥️ **随时随地使用提示词工作台**：手机端直接连接云端或局域网 ComfyUI 服务。
            - ☁️ **云端生图与多模态反推**：支持自然语言描述扩写、空间区域排版以及 Danbooru 动漫标签反推。
            - 🔄 **实时双向同步**：提示词修改自动写回画布，支持一键撤销与历史版本管理。

            #### 📥 下载安装方法
            1. 点击下方 Assets 区域的 **`ComfyUI-PromptStudio-v1.0.0.apk`** 直接下载。
            2. 在 Android 手机上打开安装（首次安装需允许系统安装来自浏览器的应用）。
            3. 启动应用后即可流畅使用提示词工作室！
